{% extends "base.html" %}{% block content %}
<main class="shop-page"><section class="shop-hero"><p class="shop-eyebrow">SIDE-B STAFF</p><h1>Manage Artists</h1></section>
<div class="admin-wrap"><div class="admin-top"><a class="shop-filter" href="{{ url_for('admin_orders') }}">Dashboard</a><a class="shop-filter" href="{{ url_for('admin_artist_form') }}">Add Artist</a></div>
<section class="cart-summary"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Artist</th><th>Genre</th><th>Action</th></tr></thead><tbody>
{% for artist in artists %}<tr><td>{{ artist.name }}</td><td>{{ artist.genre }}</td><td><a href="{{ url_for('admin_artist_form', artist_id=artist.id) }}">Edit</a></td></tr>{% endfor %}
</tbody></table></div></section></div></main>{% endblock %}
